name: Smoke test (converter only)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build synthetic input zip
        run: python scripts/make_example_zip.py examples/example_input.zip

      - name: Convert
        run: |
          python scripts/convert_to_ms.py \
            --zip examples/example_input.zip \
            --out work --require-ms2

      - name: Show conversion report
        if: always()
        run: cat work/conversion_report.txt || true

      - name: Check output
        run: |
          N=$(ls work/ms_files/*.ms | wc -l)
          echo "produced $N .ms files (expected 7: 4 from CSV + 3 from HDF5)"
          test "$N" -ge 7
          grep -q ">parentmass" work/ms_files/*.ms
          grep -q ">collision" work/ms_files/*.ms
          echo '--- sample ---'
          cat "$(ls work/ms_files/*.ms | head -n1)"

      - name: Build synthetic DEIMoS-format input
        run: python scripts/make_example_zip.py examples/deimos_input.zip --deimos

      - name: Convert DEIMoS layout
        run: |
          python scripts/convert_to_ms.py --zip examples/deimos_input.zip \
            --out work_deimos --iso-rt-tol 0.01 --require-ms2
          cat work_deimos/conversion_report.txt

      - name: Check DEIMoS output
        run: |
          N=$(ls work_deimos/ms_files/*.ms | wc -l)
          echo "DEIMoS: produced $N .ms files (expected 6)"
          test "$N" -eq 6
          grep -c "^>ms1peaks" work_deimos/ms_files/*.ms > /dev/null
          # every feature must get a REAL isotope envelope, not a noise cloud
          grep -q "with 2\+ isotope peaks" work_deimos/conversion_report.txt
          python - <<'PY'
          import glob, sys
          bad = 0
          for f in glob.glob("work_deimos/ms_files/*.ms"):
              blk, mzs = False, []
              for line in open(f):
                  if line.startswith(">ms1peaks"): blk = True; continue
                  if line.startswith(">"): blk = False; continue
                  if blk and line.strip(): mzs.append(float(line.split()[0]))
              gaps = [round(b - a, 3) for a, b in zip(mzs, mzs[1:])]
              if any(abs(g - 1.003) > 0.02 for g in gaps):
                  print("BAD isotope spacing in", f, gaps); bad += 1
          sys.exit(1 if bad else 0)
          PY
          echo '--- sample ---'
          cat "$(ls work_deimos/ms_files/*.ms | head -n1)"

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-ms-files
          path: |
            work/**
            work_deimos/**
